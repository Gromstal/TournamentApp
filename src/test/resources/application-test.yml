spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
      hibernate.format_sql: false
      hibernate.default_schema: public
    show-sql: false

  flyway:
    enabled: false

  cache:
    type: simple

env:
  ignoreif-missing: true

pairing:
  algorithm:
    timeout-ms: 5000

tournament:
  needToDelete: false

logging:
  level:
    root: WARN
    org.example.tournamentapp: INFO
