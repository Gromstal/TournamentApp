<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список участников</title>
    <link rel="stylesheet" href="setupPage.css">
</head>
<body>

<h1>Список участников</h1>

<form id="playerForm" th:action="@{/setup}" method="post" th:object="${wrapper}">
    <div class="table-with-button" style="position: relative; width: 70%; margin: 0 auto;">
        <table id="playerTable">
            <thead>
            <tr>
                <th>Имя</th>
                <th>Фракция</th>
            </tr>
            </thead>
            <tbody id="playerTableBody">
            <tr class="player-row" ondblclick="removeRow(this)" th:each="player, iterStat : ${wrapper.playerList}">
                <td><input type="text" th:field="*{playerList[__${iterStat.index}__].name}" maxlength="50"/></td>
                <td><input type="text" th:field="*{playerList[__${iterStat.index}__].faction}" maxlength="50"/></td>
            </tr>
            </tbody>
        </table>

        <button type="button" class="add-player-btn" style="position: absolute; top: 0; left: 95%;" onclick="addRow() ">Добавить игрока</button>
    </div>

    <div style="text-align: center; margin-top: 20px;">
        <label for="tourCount">Количество туров:</label>
        <input type="number" id="tourCount" name="tourCount" min="1" required>

        <label>
            <input type="checkbox" name="tourFlag"> Сформировать пары вручную
        </label>
    </div>

    <div style="text-align: center; margin-top: 20px;">
        <button type="submit">Сформировать пары</button>
    </div>
</form>


<template id="rowTemplate">
    <tr class="player-row" ondblclick="removeRow(this)">
        <td><input type="text" name="playerList[0].name" maxlength="50"/></td>
        <td><input type="text" name="playerList[0].faction" maxlength="50"/></td>
    </tr>
</template>

<script>
    function addRow() {
        const tableBody = document.getElementById('playerTableBody');
        const template = document.getElementById('rowTemplate');
        const newRow = document.importNode(template.content, true);
        tableBody.appendChild(newRow);
        reindexRows();
    }

    function removeRow(row) {
        row.remove();
        reindexRows();
    }

    function reindexRows() {
        const rows = document.querySelectorAll('#playerTableBody .player-row');
        rows.forEach((row, index) => {
            const inputs = row.querySelectorAll('input');
            if (inputs.length === 2) {
                inputs[0].setAttribute('name', `playerList[${index}].name`);
                inputs[1].setAttribute('name', `playerList[${index}].faction`);
            }
        });
    }

    document.getElementById('playerForm').addEventListener('submit', function (event) {
        const nameInputs = document.querySelectorAll('#playerTableBody input[name$=".name"]');
        const names = [];
        let hasEmptyName = false;
        let hasDuplicates = false;

        nameInputs.forEach(input => {
            const trimmedName = input.value.trim();
            if (trimmedName === '') {
                hasEmptyName = true;
            } else {
                if (names.includes(trimmedName)) {
                    hasDuplicates = true;
                } else {
                    names.push(trimmedName);
                }
            }
        });

        if (hasEmptyName) {
            alert('У всех игроков должно быть указано имя!');
            event.preventDefault();
            return;
        }

        if (hasDuplicates) {
            alert('Имена игроков должны быть уникальными!');
            event.preventDefault();
        }
    });
</script>

</body>
</html>
