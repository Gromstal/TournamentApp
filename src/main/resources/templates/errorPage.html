<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка</title>
    <link rel="stylesheet" th:href="@{/css/warcrow-ui.css}">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h2>Ну приехали… Что-то пошло не так 😬</h2>
        </div>

        <div class="page-content">
            <div class="card">
                <div class="card-body text-center">
                    <div class="alert alert-error" style="margin-bottom: var(--spacing-lg);">
                        <p th:if="${message}" th:text="${message}" style="margin: 0; font-size: var(--font-size-lg);">
                        </p>
                        <p th:if="${message == null}" style="margin: 0; font-size: var(--font-size-lg);">
                            Произошла непредвиденная ошибка. Попробуйте ещё раз.
                        </p>
                    </div>
                    <a th:href="@{/}" class="btn" style="text-decoration: none; display: inline-block;">
                        Вернуться на главную
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
