<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стартовая страница</title>
    <link rel="stylesheet" th:href="@{/css/warcrow-ui.css}">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>Добро пожаловать!</h1>
        </div>

        <div class="page-content">
            <div class="card text-center">
                <div class="card-body">
                    <form th:action="@{/setup}" method="get" style="margin-bottom: var(--spacing-xl);">
                        <button type="submit" class="btn btn-gold" style="width: 280px; padding: var(--spacing-md) var(--spacing-xl);">
                            Создать турнир
                        </button>
                    </form>

                    <p class="text-center" style="max-width: 600px; margin: 0 auto var(--spacing-xl); color: var(--color-text-secondary);">
                        ...или, если турнир уже идет и вы хотите продолжить заполнять результаты, то выберите турнир из списка
                    </p>

                    <form th:action="@{/}" method="post" style="margin-top: var(--spacing-xl);">
                        <div style="margin-bottom: var(--spacing-md);">
                            <select name="tournamentId" required style="width: 280px; margin: 0 auto; display: block; padding: var(--spacing-md);">
                                <option value="" disabled selected>-- выберите турнир --</option>
                                <option th:each="t : ${tournaments}"
                                        th:value="${t.id}"
                                        th:text="${t.date}">
                                </option>
                            </select>
                        </div>
                        <button type="submit" class="btn" style="width: 280px; padding: var(--spacing-md) var(--spacing-xl);">
                            Перейти к турниру
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
