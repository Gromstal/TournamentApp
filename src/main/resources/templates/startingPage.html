<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Стартовая страница</title>
    <link rel="stylesheet" href="setupPage.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
        }

        form {
            display: inline-block;
        }

        button {
            width: 250px;
            padding: 10px;
            margin: 10px;
            font-size: 16px;
        }

        select {
            padding: 10px;
            font-size: 16px;
            width: 260px;
        }

        .block {
            margin-top: 30px;
        }

        .description {
            margin-top: 20px;
            font-size: 16px;
            color: #444;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>

<h1>Добро пожаловать!</h1>

<!-- Кнопка GET: переход на создание турнира -->
<div class="block">
    <form th:action="@{/setup}" method="get">
        <button type="submit">Создать турнир</button>
    </form>
</div>

<!-- Текстовое пояснение -->
<div class="description">
    ...или, если турнир уже идет и вы хотите продолжить заполнять результаты, то выберите турнир из списка
</div>

<!-- Форма с выпадающим списком и POST-кнопкой -->
<div class="block">
    <form th:action="@{/}" method="post">
        <select id="tournamentSelect" name="selectedDate" required>
            <option value="" disabled selected>-- выберите дату турнира --</option>
            <option th:each="date : ${tournaments.dates}"
                    th:value="${date}"
                    th:text="${date}">
            </option>
        </select>
        <br>
        <button type="submit">Перейти к турниру</button>
    </form>
</div>

</body>
</html>
