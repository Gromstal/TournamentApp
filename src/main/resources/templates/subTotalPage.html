<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Итоги тура</title>
    <link rel="stylesheet" th:href="@{/css/warcrow-ui.css}">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h2>Итоги тура</h2>
            <p th:if="${currentTour}" style="text-align: center; color: var(--color-text-muted); margin-top: var(--spacing-sm);">
                Тур № <span th:text="${currentTour}"></span>
            </p>
        </div>

        <div class="page-content">
            <div class="card">
                <div class="card-body">
                    <table>
                        <thead>
                        <tr>
                            <th>Игрок</th>
                            <th style="width: 100px;">Фракция</th>
                            <th style="width: 80px;">ТР</th>
                            <th style="width: 80px;">VP</th>
                            <th style="width: 80px;">MP</th>
                            <th style="width: 80px;">AP</th>
                        </tr>
                        </thead>
                        <tbody>
                        <th:block th:each="player : ${wrapper.playerList}">
                            <tr>
                                <td th:text="${player.name}">Игрок</td>
                                <td th:text="${player.faction}">Фракция</td>
                                <td th:text="${player.tp}">ТР</td>
                                <td th:text="${player.vp}">VP</td>
                                <td th:text="${player.totalMp}">MP</td>
                                <td th:text="${player.totalAp}">AP</td>
                            </tr>
                        </th:block>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="text-center" style="margin-top: var(--spacing-xl);">
                <form th:action="@{/nextTour}" method="get" style="display: inline-block;">
                    <input type="hidden" name="tournamentId" th:value="${tournamentId}" />
                    <button type="submit" class="btn btn-gold" style="padding: var(--spacing-md) var(--spacing-xl); font-size: var(--font-size-lg);">
                        К следующему туру
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
